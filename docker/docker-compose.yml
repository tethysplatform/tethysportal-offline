version: "3.2"
services:
  tethys:
    container_name: tethys
    image: tethys-offline:test
    pull_policy: never
    build:
      cache_from:
        - tethys-offline:test
      context: ../
    ports:
      - "8080:80"
    environment:
      POSTGRES_PASSWORD: "mysecretpassword"
      TETHYS_DB_HOST: "db"
      TETHYS_DB_PORT: "5432"
      ALLOWED_HOSTS: "\"[localhost, 127.0.0.1]\""
      CSRF_TRUSTED_ORIGINS: "\"[http://localhost:8080, http://127.0.0.1]\""
      DEBUG: "False"
    healthcheck:
      test: ["CMD", "./liveness-probe.sh"]
      interval: 30s  # docker default
      timeout: 30s  # docker default
      retries: 3  # docker default
      start_period: 4m
    links:
      - db
    depends_on:
      - db
    networks:
      - airgap
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "mysecretpassword"
    networks:
      - airgap

networks:
  airgap:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
